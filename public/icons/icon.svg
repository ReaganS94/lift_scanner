  <g fill="#e5e7eb">
    <rect x="140" y="245" width="232" height="22" rx="11"/>
    <rect x="178" y="188" width="30" height="136" rx="9"/>
    <rect x="304" y="188" width="30" height="136" rx="9"/>
    <rect x="152" y="212" width="20" height="88" rx="7"/>
    <rect x="340" y="212" width="20" height="88" rx="7"/>
  </g>
</svg>
